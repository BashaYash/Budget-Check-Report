# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.onex.budgetcheck
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DS4_BAS_100
          url: http://vhoxqds4ci.sap.corporatesrv.com:44300/
          client: '100'
        app:
          name: Z_BUDGET_CHECK
          description: Budget Check Report Deployment
          package: Z_FIORI
          transport: DS4K907478
        exclude:
          - /test/
          - /localService/
